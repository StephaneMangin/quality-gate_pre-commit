# Shared path discovery/search configuration for hooks tooling.
# Values are comma-separated lists.

# Candidate local virtualenv directories (repo root level)
VENV_DIRS=.venv,venv,.env

# Preferred Python source directories for quality checks
PYTHON_SOURCE_DIRS=src,app

# Preferred module roots for manifest dependency analysis
MODULE_SEARCH_DIRS=src,addons,modules,odoo

# Technical/vendor/cache directories to always exclude from scans
SEARCH_EXCLUDED_DIRS=.github,.git,__pycache__,.venv,venv,.env,.tox,.mypy_cache,.pytest_cache,.ruff_cache,src/odoo,src/odoo-enterprise
